name: Documentation
on:
  push:
    branches:
        - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Install uv
        uses: "astral-sh/setup-uv@v10.3.3"
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: "Install dependencies"
        run: scripts/install
      - name: "Build docs"
        run: scripts/docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
